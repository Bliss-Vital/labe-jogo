<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Testes do simulador</title></head>
<body>
<pre id="saida">rodando...</pre>
<script src="../js/arte.js"></script>
<script src="../js/simulador.js"></script>
<script src="../js/desafios.js"></script>
<script src="../js/arduino.js"></script>
<script src="../js/pwm.js"></script>
<script src="../js/osciloscopio.js"></script>
<script src="../js/historia.js"></script>
<script>
  // Nos testes, o nome do furo é o próprio nó; "S1#a" e "S1#b" são dois furos da mesma coluna.
  const noBase = id => id.split('#')[0];
  let n = 0;
  const pecas = lista => lista.map(p => ({ id: 'p' + (++n), ...p }));
  const R = (a, b, valor) => ({ tipo: 'resistor', a, b, valor });
  const L = (a, b, cor = 'vermelho') => ({ tipo: 'led', a, b, cor });
  const F = (a, b) => ({ tipo: 'fio', a, b, cor: '#000' });
  const sim = lista => Simulador.simular(lista, noBase);
  const ctx = (lista, sondas = { v: null, p: null }) => {
    const res = sim(lista);
    return {
      pecas: lista, sondas, ligada: true, res, modo: 'V',
      leitura: sondas.v && sondas.p ? res.tensao(sondas.v) - res.tensao(sondas.p) : null,
      mesmaColuna: p => noBase(p.a) === noBase(p.b), no: id => res.no(id), nomePeca: () => 'A peça',
    };
  };
  // multímetro no Ω, com a fonte desligada
  const ohms = (lista, a, b) => Simulador.resistencia(lista, noBase, a, b);
  const ctxOhm = (lista, sondas, modo = 'Ω') => ({
    pecas: lista, sondas, ligada: false, res: null, modo,
    leitura: modo === 'Ω' ? ohms(lista, sondas.v, sondas.p) : 0,
    mesmaColuna: p => noBase(p.a) === noBase(p.b), no: noBase, nomePeca: () => 'A peça',
  });
  const mA = i => (i * 1000).toFixed(2) + ' mA';
  const resultados = [];
  function teste(nome, fn) {
    try { const extra = fn(); resultados.push(`ok    ${nome}${extra ? '  (' + extra + ')' : ''}`); }
    catch (e) { resultados.push(`FALHA ${nome}: ${e.message}`); }
  }
  const afirmar = (cond, msg) => { if (!cond) throw new Error(msg); };

  teste('LED + 220 Ω acende com ~13,8 mA', () => {
    const r = sim(pecas([R('TP', 'S1', 220), L('S1', 'TN')]));
    const l = r.leds[0];
    afirmar(l.aceso && Math.abs(l.corrente - 0.01379) < 0.0002, 'corrente ' + mA(l.corrente));
    afirmar(Math.abs(r.correnteFonte - l.corrente) < 1e-5, 'fonte ' + mA(r.correnteFonte));
    return mA(l.corrente);
  });
  teste('LED direto na fonte queima', () => {
    const p = pecas([L('TP', 'TN')]);
    const r = sim(p);
    afirmar(r.queimouAgora.length === 1 && p[0].queimado && !r.leds[0].aceso, 'não queimou');
  });
  teste('fio do + ao − dá curto', () => afirmar(sim(pecas([F('TP', 'TN')])).curto, 'sem curto'));
  teste('fios até as trilhas de baixo funcionam', () => {
    const r = sim(pecas([F('BP', 'S1'), R('S1', 'S2', 220), L('S2', 'S3'), F('S3', 'BN')]));
    afirmar(r.leds[0].aceso, 'apagado');
  });
  teste('LED invertido não acende e é detectado', () => {
    const r = sim(pecas([R('TP', 'S1', 220), L('TN', 'S1')]));
    afirmar(!r.leds[0].aceso && r.leds[0].invertido, 'vak ' + r.leds[0].vak);
  });
  teste('LED com 10 kΩ fica fraquinho (não conta como aceso)', () => {
    const r = sim(pecas([R('TP', 'S1', 10000), L('S1', 'TN')]));
    afirmar(!r.leds[0].aceso && r.leds[0].corrente > 1e-5, mA(r.leds[0].corrente));
    return mA(r.leds[0].corrente);
  });
  teste('dois LEDs em série', () => {
    const c = ctx(pecas([R('TP', 'S1', 220), L('S1', 'S2'), L('S2', 'TN', 'verde')]));
    afirmar(c.res.leds.every(l => l.aceso), 'apagados');
    afirmar(DESAFIOS.serie.verificar(c) && !DESAFIOS.paralelo.verificar(c), 'classificação errada');
    return mA(c.res.leds[0].corrente);
  });
  teste('dois LEDs em paralelo, um resistor para cada', () => {
    const c = ctx(pecas([R('TP', 'S1', 220), L('S1', 'TN'), R('TP', 'S2', 220), L('S2', 'TN', 'verde')]));
    afirmar(DESAFIOS.paralelo.verificar(c) && !DESAFIOS.serie.verificar(c), 'classificação errada');
    return 'fonte ' + mA(c.res.correnteFonte);
  });
  teste('paralelo com cores diferentes no mesmo resistor: um apaga', () => {
    const c = ctx(pecas([R('TP', 'S1', 220), L('S1', 'TN'), L('S1#b', 'TN#b', 'verde')]));
    afirmar(c.res.leds[0].aceso && !c.res.leds[1].aceso, 'os dois acesos?');
    const d = DESAFIOS.paralelo.dicaAoVivo(c);
    afirmar(d && /resistor para cada/.test(d.texto), 'sem dica');
  });
  teste('dois LEDs azuis em série não acendem com 5 V', () => {
    const r = sim(pecas([R('TP', 'S1', 100), L('S1', 'S2', 'azul'), L('S2', 'TN', 'azul')]));
    afirmar(r.leds.every(l => !l.aceso), 'acenderam');
  });
  teste('circuito aberto: nada de corrente', () => {
    const r = sim(pecas([R('TP', 'S1', 220), L('S2', 'TN')]));
    afirmar(r.correnteFonte < 1e-6 && !r.leds[0].aceso, mA(r.correnteFonte));
    afirmar(/aberto/.test(dicaAutomatica(ctx(pecas([R('TP', 'S1', 220), L('S2', 'TN')])), null).texto), 'sem dica');
  });
  teste('LED com as pernas na mesma coluna é avisado', () => {
    const c = ctx(pecas([R('TP', 'S1', 220), L('S2#a', 'S2#b')]));
    afirmar(/mesmo grupo/.test(dicaAutomatica(c, null).texto), 'sem aviso');
  });
  teste('multímetro: tensão do LED e do resistor somam 5 V', () => {
    const p = pecas([R('TP', 'S1', 220), L('S1', 'TN')]);
    const cLed = ctx(p, { v: 'S1', p: 'TN' });
    const cRes = ctx(p, { v: 'TP', p: 'S1' });
    afirmar(DESAFIOS['medir-led'].verificar(cLed), 'medir-led falhou');
    afirmar(DESAFIOS['medir-resistor'].verificar(cRes), 'medir-resistor falhou');
    afirmar(Math.abs(cLed.leitura + cRes.leitura - 5) < 0.01, 'soma ' + (cLed.leitura + cRes.leitura));
    const vars = DESAFIOS['medir-resistor'].aoConcluir(cRes);
    return `LED ${cLed.leitura.toFixed(2)} V, resistor ${cRes.leitura.toFixed(2)} V, I = ${vars.medidaI} mA`;
  });
  teste('multímetro com pontas invertidas mostra negativo e não conclui', () => {
    const c = ctx(pecas([R('TP', 'S1', 220), L('S1', 'TN')]), { v: 'TN', p: 'S1' });
    afirmar(c.leitura < 0 && !DESAFIOS['medir-led'].verificar(c), 'leitura ' + c.leitura);
  });
  teste('código de cores', () => {
    afirmar(Arte.faixasDoValor(220).join() === 'vermelho,vermelho,marrom', '220');
    afirmar(Arte.faixasDoValor(10000).join() === 'marrom,preto,laranja', '10k');
    afirmar(Arte.valorDasFaixas(['amarelo', 'violeta', 'vermelho']) === 4700, '4k7');
    afirmar(Arte.ohms(4700) === '4,7 kΩ', Arte.ohms(4700));
  });

  // ---------------------------------------------------------------- Arduino
  const pino = (no, v, r = 25) => [{ no, v, r }];
  teste('pino 13 em HIGH acende o LED com resistor', () => {
    const r = Simulador.simular(pecas([R('D13', 'S1', 220), L('S1', 'TN')]), noBase, pino('D13', 5));
    afirmar(r.leds[0].aceso && Math.abs(r.leds[0].corrente - 0.01245) < 0.0003, mA(r.leds[0].corrente));
    return mA(r.leds[0].corrente);
  });
  teste('pino em LOW deixa o LED apagado', () => {
    const r = Simulador.simular(pecas([R('D13', 'S1', 220), L('S1', 'TN')]), noBase, pino('D13', 0));
    afirmar(!r.leds[0].aceso, 'aceso');
  });
  teste('sem pinMode (só pull-up) o LED fica quase apagado', () => {
    const r = Simulador.simular(pecas([R('D13', 'S1', 220), L('S1', 'TN')]), noBase, pino('D13', 5, 35000));
    afirmar(!r.leds[0].aceso && r.leds[0].corrente > 1e-5, mA(r.leds[0].corrente));
  });
  teste('buzzer no pino 8 apita; invertido não', () => {
    const r1 = Simulador.simular(pecas([{ tipo: 'buzzer', a: 'D8', b: 'TN' }]), noBase, pino('D8', 5));
    const r2 = Simulador.simular(pecas([{ tipo: 'buzzer', a: 'TN', b: 'D8' }]), noBase, pino('D8', 5));
    afirmar(r1.buzzers[0].soando && !r2.buzzers[0].soando && r2.buzzers[0].invertido, 'buzzer errado');
    return mA(r1.buzzers[0].corrente);
  });
  teste('pino em HIGH ligado direto no GND é curto no pino', () => {
    const r = Simulador.simular(pecas([F('D13', 'TN')]), noBase, pino('D13', 5));
    afirmar(r.curtoPino === 'D13', String(r.curtoPino));
  });
  teste('interpretador: Blink deixa o pino 13 em HIGH até o primeiro delay', () => {
    Arduino.iniciar({ editor: document.createElement('div') });
    const p = Arduino.programa;
    p.setup.push({ cmd: 'pinMode', pino: 13, modo: 'OUTPUT' });
    p.loop.push({ cmd: 'digitalWrite', pino: 13, valor: 'HIGH' }, { cmd: 'delay', ms: 1000 }, { cmd: 'digitalWrite', pino: 13, valor: 'LOW' }, { cmd: 'delay', ms: 1000 });
    Arduino.enviar();
    const f = Arduino.fontes();
    Arduino.parar(false);
    afirmar(f.length === 1 && f[0].no === 'D13' && f[0].v === 5, JSON.stringify(f));
  });
  teste('dica: avisa quando falta o pinMode', () => {
    Arduino.iniciar({ editor: document.createElement('div') });
    Arduino.programa.loop.push({ cmd: 'digitalWrite', pino: 13, valor: 'HIGH' }, { cmd: 'delay', ms: 500 }, { cmd: 'digitalWrite', pino: 13, valor: 'LOW' }, { cmd: 'delay', ms: 500 });
    Arduino.enviar();
    const d = dicaArduino({ arduino: { rodando: true, programa: Arduino.programa, pinos: Arduino.pinos } }, 13);
    Arduino.parar(false);
    afirmar(d && /pinMode/.test(d.texto), d ? d.texto : 'sem dica');
  });
  // ---------------------------------------------------------------- motor
  const M = (a, b) => ({ tipo: 'motor', a, b });
  teste('motor direto na fonte gira no sentido horário com ~200 mA', () => {
    const r = sim(pecas([M('TP', 'TN')]));
    const m = r.motores[0];
    afirmar(m.girando && m.sentido === 1 && m.velocidade > 0.99, JSON.stringify({ sentido: m.sentido, v: m.velocidade }));
    afirmar(Math.abs(m.corrente - 0.2) < 0.002 && Math.abs(r.correnteFonte - m.corrente) < 1e-5, mA(m.corrente));
    return `${mA(m.corrente)}, ${Math.round(m.rpm)} rpm`;
  });
  teste('motor invertido gira no sentido anti-horário', () => {
    const m = sim(pecas([M('TN', 'TP')])).motores[0];
    afirmar(m.girando && m.sentido === -1, 'sentido ' + m.sentido);
  });
  teste('resistor em série deixa o motor mais devagar; 220 Ω faz ele parar', () => {
    const v10 = sim(pecas([R('TP', 'S1', 10), M('S1', 'TN')])).motores[0];
    const v47 = sim(pecas([R('TP', 'S1', 47), M('S1', 'TN')])).motores[0];
    const p = pecas([R('TP', 'S1', 220), M('S1', 'TN')]);
    const v220 = sim(p).motores[0];
    afirmar(v10.girando && v47.girando && v47.velocidade < v10.velocidade && v10.velocidade < 0.85, `${v10.velocidade} ${v47.velocidade}`);
    afirmar(!v220.girando && v220.tensao > 0.05, 'tensão ' + v220.tensao);
    const d = dicaAutomatica(ctx(p), DESAFIOS['motor-devagar']);
    afirmar(d && /atrito/.test(d.texto), d ? d.texto : 'sem dica');
    return `10 Ω: ${v10.tensao.toFixed(2)} V, 47 Ω: ${v47.tensao.toFixed(2)} V, 220 Ω: ${v220.tensao.toFixed(2)} V`;
  });
  teste('desafio "mais devagar": série vale, resistor em paralelo não', () => {
    const d = DESAFIOS['motor-devagar'];
    const serie = ctx(pecas([R('TP', 'S1', 10), M('S1', 'TN')]));
    const paralelo = ctx(pecas([R('TP', 'TN', 47), M('TP', 'TN')]));
    afirmar(d.verificar(serie) && !d.verificar(paralelo), 'verificar errado');
    afirmar(/paralelo/.test(d.dicaAoVivo(paralelo).texto), 'sem dica de paralelo');
    const vars = d.aoConcluir(serie);
    afirmar(vars.resistorMotor === '10 Ω', JSON.stringify(vars));
    return JSON.stringify(vars);
  });
  teste('desafio "inverta o sentido" só vale com o motor girando ao contrário', () => {
    DESAFIOS['liga-motor'].aoConcluir(ctx(pecas([M('TP', 'TN')])));
    const d = DESAFIOS['inverte-motor'];
    afirmar(!d.verificar(ctx(pecas([M('TP', 'TN')]))) && d.verificar(ctx(pecas([M('TN', 'TP')]))), 'verificar errado');
  });
  teste('circuito do motor aberto avisa; com o motor em curto ele não gira', () => {
    const d = dicaAutomatica(ctx(pecas([M('S1', 'TN')])), DESAFIOS['liga-motor']);
    afirmar(d && /aberto/.test(d.texto), d ? d.texto : 'sem dica');
    const m = sim(pecas([F('TP', 'S1'), M('S1', 'S2'), F('S1', 'S2'), F('S2', 'TN')])).motores[0];
    afirmar(!m.girando, 'girou');
  });

  // ---------------------------------------------------------------- circuitos equivalentes
  teste('ohmímetro: série soma, paralelo dá a metade, fio liga e sem caminho é OL', () => {
    const serie = ohms(pecas([R('S1', 'S2', 1000), R('S2', 'S3', 2200)]), 'S1', 'S3');
    const paralelo = ohms(pecas([R('S1', 'S2', 1000), R('S1#b', 'S2#b', 1000)]), 'S1', 'S2');
    const comFio = ohms(pecas([R('S1', 'S2', 1000), F('S2', 'S5'), R('S5', 'S6', 220)]), 'S1', 'S6');
    afirmar(Math.abs(serie - 3200) < 0.1 && Math.abs(paralelo - 500) < 0.1 && Math.abs(comFio - 1220) < 0.1, `${serie} ${paralelo} ${comFio}`);
    afirmar(ohms(pecas([R('S1', 'S2', 1000)]), 'S1', 'S5') === Infinity, 'sem caminho');
    afirmar(ohms(pecas([R('S1', 'S2', 1000)]), 'S1', 'S1#b') === 0, 'mesmo ponto');
    afirmar(Math.abs(ohms(pecas([R('S1', 'S2', 10000), R('S1#b', 'S2#b', 100)]), 'S1', 'S2') - 99.01) < 0.01, 'grande com pequeno');
    return `${serie.toFixed(0)} Ω, ${paralelo.toFixed(0)} Ω`;
  });
  teste('desafio "série": 1 kΩ + 2,2 kΩ no Ω vale; no V⎓ ou com um resistor só, não', () => {
    const d = DESAFIOS['equivalente-serie'];
    const p = pecas([R('S1', 'S2', 1000), R('S2', 'S3', 2200)]);
    afirmar(d.verificar(ctxOhm(p, { v: 'S1', p: 'S3' })), 'não concluiu');
    const noV = ctxOhm(p, { v: 'S1', p: 'S3' }, 'V');
    afirmar(!d.verificar(noV) && /Ω/.test(dicaAutomatica(noV, d).texto), 'modo V');
    afirmar(!d.verificar(ctxOhm(p, { v: 'S2', p: 'S3' })), 'um resistor só');
    afirmar(/OL/.test(d.dicaAoVivo(ctxOhm(p, { v: 'S1', p: 'S7' })).texto), 'sem dica de OL');
  });
  teste('desafio "série": com a fonte ligada pede para desligar', () => {
    const c = ctx(pecas([R('S1', 'S2', 1000), R('S2', 'S3', 2200)]), { v: 'S1', p: 'S3' });
    c.modo = 'Ω';
    c.leitura = null;
    const d = dicaAutomatica(c, DESAFIOS['equivalente-serie']);
    afirmar(d && /Desligue a fonte/.test(d.texto), d ? d.texto : 'sem dica');
  });
  teste('desafio "paralelo": dois de 1 kΩ lado a lado valem; em série não', () => {
    const d = DESAFIOS['equivalente-paralelo'];
    const par = ctxOhm(pecas([R('S1', 'S2', 1000), R('S1#b', 'S2#b', 1000)]), { v: 'S1', p: 'S2' });
    const ser = ctxOhm(pecas([R('S1', 'S2', 1000), R('S2', 'S3', 1000)]), { v: 'S1', p: 'S3' });
    afirmar(d.verificar(par) && !d.verificar(ser), 'verificar errado');
    afirmar(/menor/.test(d.dicaAoVivo(ser).texto), 'sem dica de série');
    afirmar(!d.verificar(ctxOhm(pecas([R('S1', 'S2', 470)]), { v: 'S1', p: 'S2' })), '470 sozinho valeu');
  });
  teste('desafio "divisor": 1 kΩ + 1 kΩ dá 2,5 V no meio e Rth de 500 Ω', () => {
    const d = DESAFIOS.divisor;
    const p = pecas([R('TP', 'S1', 1000), R('S1', 'TN', 1000)]);
    const c = ctx(p, { v: 'S1', p: 'TN' });
    afirmar(d.verificar(c), 'leitura ' + c.leitura);
    const vars = d.aoConcluir(c);
    afirmar(vars.divisorRth === '500 Ω' && vars.divisorV === '2,50', JSON.stringify(vars));
    afirmar(!d.verificar(ctx(p, { v: 'TP', p: 'S1' })), 'preta fora do −');
    const desigual = ctx(pecas([R('TP', 'S1', 220), R('S1', 'TN', 1000)]), { v: 'S1', p: 'TN' });
    afirmar(!d.verificar(desigual) && /mesmo valor/.test(d.dicaAoVivo(desigual).texto), 'divisor desigual');
    const noOhm = Object.assign(ctx(p, { v: 'S1', p: 'TN' }), { modo: 'Ω' });
    afirmar(!d.verificar(noOhm) && /V⎓/.test(d.dicaAoVivo(noOhm).texto), 'seletor em Ω');
    return JSON.stringify(vars);
  });
  teste('desafio "carga": 10 kΩ quase não muda a saída; 1 kΩ derruba', () => {
    const d = DESAFIOS.carga;
    const divisor = [R('TP', 'S1', 1000), R('S1', 'TN', 1000)];
    const grande = ctx(pecas([...divisor, R('S1#b', 'TN#b', 10000)]), { v: 'S1', p: 'TN' });
    const pequena = ctx(pecas([...divisor, R('S1#b', 'TN#b', 1000)]), { v: 'S1', p: 'TN' });
    afirmar(d.verificar(grande), 'grande: ' + grande.leitura);
    afirmar(!d.verificar(pequena) && /maior/.test(d.dicaAoVivo(pequena).texto), 'pequena: ' + pequena.leitura);
    afirmar(!d.verificar(ctx(pecas(divisor), { v: 'S1', p: 'TN' })), 'sem carga valeu');
    const vars = d.aoConcluir(grande);
    afirmar(vars.cargaR === '10 kΩ', JSON.stringify(vars));
    return `10 kΩ: ${grande.leitura.toFixed(2)} V, 1 kΩ: ${pequena.leitura.toFixed(2)} V`;
  });

  // ---------------------------------------------------------------- roteiro
  teste('roteiro: falas, desafios e ilustrações existem', () => {
    const erros = [];
    for (const o of OFICINAS) for (const p of o.passos) {
      if (p.quem && !['voce', 'narrador'].includes(p.quem) && !PERSONAGENS[p.quem]) erros.push(`${o.id}: quem '${p.quem}'`);
      for (const g of p.grupo || []) if (!PERSONAGENS[g]) erros.push(`${o.id}: grupo '${g}'`);
      if (p.tipo === 'desafio' && !DESAFIOS[p.id]) erros.push(`${o.id}: desafio '${p.id}'`);
      if (p.ilustracao && !Arte.ilustracao(p.ilustracao)) erros.push(`${o.id}: ilustração '${p.ilustracao}'`);
      if (p.tipo === 'osciloscopio' && !Osciloscopio.METAS[p.meta]) erros.push(`${o.id}: meta do osciloscópio '${p.meta}'`);
    }
    for (const [id, d] of Object.entries(DESAFIOS)) if (!PERSONAGENS[d.monitora]) erros.push(`desafio ${id}: monitora '${d.monitora}'`);
    afirmar(!erros.length, erros.join('; '));
    return `${OFICINAS.length} oficinas`;
  });

  // ---------------------------------------------------------------- chefão final: o osciloscópio
  const NIVEIS = Array.from({ length: 17 }, (_, i) => i - 8);
  teste('osciloscópio: cada rodada do roteiro começa errada e tem um só ajuste certo de VOLTS/DIV e TEMPO/DIV', () => {
    const rodadas = OFICINAS.flatMap(o => o.passos).filter(p => p.tipo === 'osciloscopio');
    afirmar(rodadas.length === 4, `${rodadas.length} rodadas`);
    const resumo = [];
    for (const p of rodadas) {
      const ini = Object.assign({ volts: 1, tempo: 1, trigger: 0 }, p.inicio);
      const meta = Osciloscopio.METAS[p.meta];
      afirmar(!meta(Osciloscopio.avaliar(p.sinal, ini, p.zero)), `${p.meta}: já começa resolvida`);
      const opcoes = c => (p.controles.includes(c) ? (c === 'volts' ? Osciloscopio.VOLTS : c === 'tempo' ? Osciloscopio.TEMPOS : NIVEIS) : [ini[c]]);
      const certos = { volts: new Set(), tempo: new Set(), trigger: new Set() };
      for (const volts of opcoes('volts')) for (const tempo of opcoes('tempo')) for (const trigger of opcoes('trigger')) {
        if (!meta(Osciloscopio.avaliar(p.sinal, { volts, tempo, trigger }, p.zero))) continue;
        certos.volts.add(volts); certos.tempo.add(tempo); certos.trigger.add(trigger);
      }
      afirmar(certos.volts.size === 1 && certos.tempo.size === 1 && certos.trigger.size >= 1, `${p.meta}: ${JSON.stringify({ volts: [...certos.volts], tempo: [...certos.tempo] })}`);
      const niveis = [...certos.trigger];
      resumo.push(`${p.meta}: ${[...certos.volts]} V, ${[...certos.tempo]} ms, trigger ${Math.min(...niveis)} a ${Math.max(...niveis)} V`);
    }
    return resumo.join('; ');
  });
  teste('osciloscópio: Vpp, ondas na tela e trigger', () => {
    const seno = { forma: 'seno', vpp: 6, f: 250 }, pwm = { forma: 'quadrada', alto: 5, baixo: 0, f: 490, ciclo: 0.25 };
    const s = Osciloscopio.avaliar(seno, { volts: 1, tempo: 1, trigger: 0 });
    afirmar(s.altura === 6 && s.cabe && s.grande && s.ondas === 2.5 && s.disparou, JSON.stringify(s));
    afirmar(!Osciloscopio.avaliar(seno, { volts: 0.5, tempo: 1, trigger: 0 }).cabe, '12 divisões couberam');
    afirmar(!Osciloscopio.avaliar(seno, { volts: 1, tempo: 1, trigger: 3 }).disparou, 'disparou no pico');
    afirmar(!Osciloscopio.avaliar(pwm, { volts: 1, tempo: 0.5, trigger: 1 }, 0).cabe, 'PWM coube sem baixar o 0 V');
    afirmar(Osciloscopio.avaliar(pwm, { volts: 1, tempo: 0.5, trigger: 1 }, -3).cabe, 'PWM não coube com o 0 V embaixo');
  });

  // roda o minijogo com quadros falsos e devolve a imagem da tela depois de n quadros
  function telaOsc(painel, n, passo = 37) {
    const rafOriginal = window.requestAnimationFrame;
    let proximo = null;
    window.requestAnimationFrame = cb => { proximo = cb; return 1; };
    return {
      iniciar(opcoes) { Osciloscopio.iniciar(painel, opcoes); },
      quadros() {
        const t0 = performance.now(), ctx = painel.querySelector('canvas').getContext('2d'), imagens = [];
        for (let k = 0; k < n && proximo; k++) {
          const cb = proximo; proximo = null;
          cb(t0 + k * passo);
          imagens.push(ctx.getImageData(0, 0, 200, 160).data);
        }
        return imagens;
      },
      fim() { Osciloscopio.parar(); window.requestAnimationFrame = rafOriginal; },
    };
  }
  const iguais = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
  teste('osciloscópio: com trigger a imagem fica parada e passa pelo nível no meio da tela; sem trigger, ela corre', () => {
    const painel = document.createElement('div');
    const sinal = { forma: 'seno', vpp: 6, f: 250 };
    const t = telaOsc(painel, 14);
    t.iniciar({ sinal, inicio: { volts: 1, tempo: 1, trigger: 2 }, meta: 'trigger', controles: ['trigger'] });
    const parada = t.quadros();
    t.fim();
    afirmar(iguais(parada[12], parada[13]), 'com trigger a imagem mudou');
    // nível de 2 V com 1 V/div: 2 divisões (40 pixels) acima do meio, na coluna do meio
    const i = (40 * 200 + 100) * 4;
    afirmar(parada[13][i + 1] > 200, `pixel do disparo: ${[...parada[13].slice(i, i + 3)]}`);
    const u = telaOsc(painel, 14);
    u.iniciar({ sinal, inicio: { volts: 1, tempo: 1, trigger: 6 }, meta: 'trigger', controles: ['trigger'] });
    const corre = u.quadros();
    u.fim();
    afirmar(!iguais(corre[12], corre[13]), 'sem trigger a imagem ficou parada');
  });
  teste('osciloscópio: só o botão da rodada funciona, vence uma vez e trava', () => {
    const painel = document.createElement('div');
    let vitorias = 0;
    const t = telaOsc(painel, 1);
    t.iniciar({ sinal: { forma: 'seno', vpp: 6, f: 500 }, inicio: { volts: 10, tempo: 0.5, trigger: 0 }, meta: 'volts', controles: ['volts'], aoVencer: () => vitorias++ });
    const botao = (c, d) => painel.querySelector(`button[data-c="${c}"][data-d="${d}"]`);
    afirmar(botao('tempo', 1).disabled && botao('trigger', 1).disabled, 'botões travados liberados');
    for (let k = 0; k < 5; k++) if (!botao('volts', -1).disabled) botao('volts', -1).click();
    const valor = painel.querySelector('[data-valor="volts"]').textContent;
    t.fim();
    afirmar(vitorias === 1 && valor === '1 V', `${vitorias} vitórias, ${valor}`);
    afirmar([...painel.querySelectorAll('.osc-ctrl button')].every(b => b.disabled), 'botões continuam liberados');
  });

  // ---------------------------------------------------------------- minijogo do PWM
  // roda o minijogo quadro a quadro (60 por segundo), apertando conforme apertado(t)
  function jogarPWM(apertado, segundos = 10) {
    const rafOriginal = window.requestAnimationFrame;
    let proximo = null, venceu = null;
    window.requestAnimationFrame = cb => { proximo = cb; return 1; };
    const painel = document.createElement('div');
    MinijogoPWM.iniciar(painel, { faixa: [40, 60], segundos: 4, aoVencer: info => { if (!venceu) venceu = Object.assign({ t }, info); } });
    let t = 0, antes = false;
    const t0 = performance.now();
    for (; t < segundos && proximo; t += 1 / 60) {
      const agora = apertado(t);
      if (agora !== antes) document.dispatchEvent(new KeyboardEvent(agora ? 'keydown' : 'keyup', { key: ' ' }));
      antes = agora;
      const cb = proximo; proximo = null;
      cb(t0 + t * 1000);
    }
    const velocidade = parseInt(painel.querySelector('.pwm-vel').textContent, 10);
    MinijogoPWM.parar();
    window.requestAnimationFrame = rafOriginal;
    return { venceu, velocidade };
  }
  teste('PWM: toques no ritmo de 50% vencem com ciclo perto de 50%', () => {
    const r = jogarPWM(t => (t % 0.32) < 0.16);
    afirmar(r.venceu && Math.abs(r.venceu.ciclo - 50) <= 8, JSON.stringify(r));
    return `venceu em ${r.venceu.t.toFixed(1)} s, ciclo ${r.venceu.ciclo}%`;
  });
  teste('PWM: segurando direto vai a 100% e não vence', () => {
    const r = jogarPWM(() => true);
    afirmar(!r.venceu && r.velocidade >= 95, JSON.stringify(r));
  });
  teste('PWM: sem apertar o carrinho fica parado', () => {
    const r = jogarPWM(() => false, 5);
    afirmar(!r.venceu && r.velocidade === 0, JSON.stringify(r));
  });
  teste('PWM: toques curtos (20%) deixam devagar demais', () => {
    const r = jogarPWM(t => (t % 0.3) < 0.06);
    afirmar(!r.venceu && r.velocidade < 40, JSON.stringify(r));
    return `${r.velocidade}%`;
  });

  const falhas = resultados.filter(r => r.startsWith('FALHA')).length;
  document.getElementById('saida').textContent = resultados.join('\n') + `\n\n${resultados.length - falhas}/${resultados.length} passaram`;
  document.title = falhas ? 'FALHOU' : 'OK';
</script>
